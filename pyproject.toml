[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capsule-emit-mesh-sidecar"
version = "0.1.0"
description = "Ask-and-verify quickstart + sidecar packaging for capsule-emit-mesh (a neutral accountability PoC for Mesh-LLM)."
readme = "QUICKSTART.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    # capsule_sidecar.py imports capsule_emit.checkpoint / capsule_emit.signing (via checkpointing.py)
    # and agent_action_capsule directly; capsule-emit itself depends on agent-action-capsule, but the
    # verify/mesh modules import agent_action_capsule directly too, so it's pinned explicitly here.
    "agent-action-capsule>=0.2.0",
    # Floor 0.7.1 (matches requirements.txt): evidence_responder.py/ask_history.py
    # (both packaged below) import capsule_emit.adjudication/evidence_request,
    # which only ship in the 0.7.1 wheel. This floor is untested by CI (which
    # installs from requirements.txt, never builds this wheel) so it drifted
    # stale at 0.5.1 -- the exact broken version this sweep started from.
    "capsule-emit>=0.7.1",
    # scitt-cose and cryptography are NOT pulled by plain capsule-emit; capsule_sidecar.py imports
    # scitt_cose directly, and requester_commitment.py / node_ownership.py import cryptography directly.
    "scitt-cose>=0.2.2",
    "cryptography",
]

[project.urls]
Homepage = "https://github.com/action-state-group/capsule-emit-mesh"

[project.scripts]
# The native-plugin path (StevenMih/mesh-llm PRs #1/#2/#3 on top of upstream #1437) has no Python
# side to package -- it's Rust, built inside mesh-llm itself. These three cover the sidecar-now path.
capsule-sidecar = "capsule_sidecar:main"
capsule-coordinator-verify = "capsule_coordinator_verify:main"
capsule-disclosure-endpoint = "capsule_disclosure_endpoint:main"
capsule-evidence-server = "evidence_server:main"
ask-history = "ask_history:main"

[tool.setuptools]
# Flat module layout (no package directory) -- listed explicitly rather than relying on setuptools'
# flat-layout auto-discovery, which refuses to guess among this many top-level modules. Exactly the
# transitive closure the five console scripts above need; the repo's other top-level scripts
# (demos, red-team fixtures, the Rust plugin harness, etc.) are dev-only and stay out of the wheel.
py-modules = [
    "capsule_sidecar",
    "evidence_responder",
    "evidence_server",
    "ask_history",
    "history_card",
    "join_card",
    "advertisement",
    "mac_hardware_inventory",
    "checkpointing",
    "model_identity",
    "node_ownership",
    "mesh_coordinator_bundle_flow",
    "mesh_coordinator_receipt_emitter",
    "mesh_record_emitter",
    "mesh_record_verifier",
    "requester_commitment",
    "capsule_coordinator_verify",
    "capsule_disclosure_endpoint",
]
