[package]
name = "admission-policy-plugin"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Real mesh-llm-plugin admission-policy plugin: denies exchanges whose model matches a blocked prefix, over mesh-llm's actual Envelope wire protocol."
publish = false

[[bin]]
name = "admission-policy-plugin"
path = "src/main.rs"

[features]
# Deliberately-broken variant: never denies a blocked model (fail-open bug).
# Built and run against the same interop test to prove the test actually
# distinguishes correct behavior from this specific regression.
mutant-allow-blocked = []
# Deliberately-broken variant: treats an unparseable body as allow instead of
# deny (silently fail-open on malformed input instead of failing safe).
mutant-allow-malformed = []

[dependencies]
mesh-llm-plugin = "0.75"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
