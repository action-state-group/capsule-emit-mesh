[package]
name = "admission-policy-plugin"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Real mesh-llm-plugin admission-policy plugin: denies exchanges whose model matches a blocked prefix, over mesh-llm's actual Envelope wire protocol."
publish = false

[[bin]]
name = "admission-policy-plugin"
path = "src/main.rs"

[features]
# Deliberately-broken variant: never denies a blocked model (fail-open bug).
# Built and run against the same interop test to prove the test actually
# distinguishes correct behavior from this specific regression.
mutant-allow-blocked = []
# Deliberately-broken variant: treats an unparseable body as allow instead of
# deny (silently fail-open on malformed input instead of failing safe).
mutant-allow-malformed = []

[dependencies]
mesh-llm-plugin = "0.75"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
capsule-producer = { path = "../capsule-producer" }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Regular (not dev-only) dependency: the mesh evidence-request responder
# bridge (`mesh_evidence_bridge::handle_open_stream`) proxies a mesh-inbound
# evidence request to the local `evidence_server.py` E15 door over real HTTP.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
# Decodes the `CallToolResult` a `tools/call` `RpcResponse` carries, in
# `tests/mesh_evidence_bridge_interop.rs` -- same version mesh-llm-plugin
# itself pins, so the wire shape matches exactly.
rmcp = "1.8"
