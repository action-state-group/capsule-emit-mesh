[package]
name = "capsule-producer"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "The Mesh-specific parts of producing Agent Action Capsules (the x-mesh-poc-v1 extension, runtime and TEE attestation) on top of capsule-emit."
publish = false

[lib]
name = "capsule_producer"
path = "src/lib.rs"

[dependencies]
# Sealing, signing, the ledger, checkpoints and offline verification. Its
# `checkpointed-local-log` is the only CLL in the lock.
capsule-emit = "0.0.8"
serde_json = { version = "1", features = ["preserve_order"] }
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
base64 = "0.22"
thiserror = "1"
# rung 3c (tee_measured): TD quote cert-chain (x509-cert/der) and signature
# (p256 = attestation key / PCK certs, p384 = Intel Trust Authority ES384 JWTs)
# verification. No network client added here — verification is purely local
# cryptography against caller-supplied quote/cert bytes.
x509-cert = { version = "0.2", default-features = false, features = ["std", "pem"] }
der = "0.7"
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
ecdsa = { version = "0.16", features = ["der"] }

[dev-dependencies]
tempfile = "3"
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = "0.13"
rustls-pki-types = "1"
