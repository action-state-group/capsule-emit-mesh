[package]
name = "capsule-producer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Milestone 1: emit an Agent Action Capsule + COSE_Sign1 signed statement in Rust, cross-checked byte-for-byte against the Python/scitt-cose reference and the Go COSE verifier. Does NOT yet do chaining/ledger/rotation/anchoring."
publish = false

[lib]
name = "capsule_producer"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
coset = "0.4"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
pkcs8 = { version = "0.10", features = ["pem"] }
spki = { version = "0.7", features = ["pem"] }
anyhow = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
