[package]
name = "capsule-producer"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Emit a chained, ledgered, optionally-anchored Agent Action Capsule + COSE_Sign1 signed statement stream in Rust, cross-checked against the Python/scitt-cose reference and the Go COSE verifier."
publish = false

[lib]
name = "capsule_producer"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
coset = "0.4"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
pkcs8 = { version = "0.10", features = ["pem"] }
spki = { version = "0.7", features = ["pem"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
# rung 3c (tee_measured): TD quote cert-chain (x509-cert/der) and signature
# (p256 = attestation key / PCK certs, p384 = Intel Trust Authority ES384 JWTs)
# verification. No network client added here — verification is purely local
# cryptography against caller-supplied quote/cert bytes.
x509-cert = { version = "0.2", default-features = false, features = ["std", "pem"] }
der = "0.7"
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
ecdsa = { version = "0.16", features = ["der"] }

[dev-dependencies]
tempfile = "3"
rcgen = "0.13"
rustls-pki-types = "1"
