# SPDX-License-Identifier: Apache-2.0
# Secrets gate: no private key, token or other secret may enter this public
# repository's history. gitleaks scans every commit reachable from the pushed
# ref or the pull request head (full history, not just the diff), with its
# default rules.
#
# Findings that were checked by hand and are NOT secrets are listed, one exact
# finding per line (commit:path:rule:line), in .gitleaksignore, each with its
# reason. A new finding is never covered by an existing entry: check it, and if
# it is genuinely not a secret, add its fingerprint there with the reason.
#
# It needs no repository secret, so it runs as a plain `pull_request` check and
# works the same for pull requests from forks.
name: secrets

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the full history
        run: gitleaks git . --redact=100 --no-banner --verbose
