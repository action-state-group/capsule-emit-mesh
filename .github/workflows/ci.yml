# SPDX-License-Identifier: Apache-2.0
# Clean-venv import smoke test.
#
# This job catches the class of defect where a dependency is undeclared
# (import works locally because it was installed by something else) or
# where a transitive dependency changes its public API and breaks an import
# that was previously fine (e.g. mcp>=2.0 removed mcp.server.fastmcp).
#
# Mutant verification (each step fails its mutant):
#   - Remove `mcp<2` from requirements.txt → "Smoke: mcp.server.fastmcp" fails
#     (mcp>=2.0 removed that module).
#   - Remove `scitt-cose` → "Smoke: scitt_cose" and "Smoke: capsule_sidecar" fail.
#   - Remove `cbor2` → "Smoke: cbor2" fails.
#   - Break import in goose/server.py → "Smoke: goose/server.py" fails.
#   - Break import in capsule_sidecar.py → "Smoke: capsule_sidecar" fails.
#   - Break import in capsule_mesh_view.py → "Smoke: capsule_mesh_view" fails.
#   - Break import in capsule_accountability_tab.py → "Smoke: capsule_accountability_tab" fails.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-smoke:
    name: Import smoke (clean venv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install declared dependencies
        run: pip install -r requirements.txt

      - name: Smoke — mcp.server.fastmcp (mcp<2 pin, item 1 regression guard)
        run: python -c "from mcp.server.fastmcp import FastMCP; print('ok')"

      - name: Smoke — scitt_cose (item 2 regression guard)
        run: python -c "import scitt_cose; print('ok')"

      - name: Smoke — cbor2 (item 2 regression guard)
        run: python -c "import cbor2; print('ok')"

      - name: Smoke — capsule_sidecar (exercises scitt_cose + agent_action_capsule + model_identity)
        run: python -c "import capsule_sidecar; print('ok')"

      - name: Smoke — goose/server.py (exercises mcp.server.fastmcp + capsule_emit.adapters.mcp)
        run: python -c "import importlib.util; spec = importlib.util.spec_from_file_location('goose_server', 'goose/server.py'); m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m); print('ok')"

      - name: Smoke — mock_lifecycle_host (rig bundled for exemplar CI)
        run: python -c "import mock_lifecycle_host; print('ok')"

      - name: Smoke — exemplar plugin_contract
        run: python -c "from exemplar.plugin_contract import CONTRACT, BodyAccessDenied; print('ok')"

      - name: Smoke — exemplar observe_only
        run: python -c "from exemplar.observe_only import ObserveOnlyPlugin; print('ok')"

      - name: Smoke — exemplar admission_policy
        run: python -c "from exemplar.admission_policy import AdmissionPolicyPlugin; print('ok')"

      - name: Smoke — delegation_issuer (issuance/renewal counterpart to the verifier)
        run: python -c "from delegation_issuer import DelegationIssuer, UnregisteredScope, ArbitrarySigningRejected, OwnerIdentityUnavailable; print('ok')"

      - name: Smoke — capsule_mesh_view (thin ledger-view wrapper joining the plugin + sidecar logs)
        run: python -c "import capsule_mesh_view; print('ok')"

      - name: Smoke — checkpoint_ledger (standalone CheckpointState CLI, no sidecar proxy needed)
        run: python -c "import checkpoint_ledger; print('ok')"

      - name: Smoke — history_card (history_card() verb -- checkpoints + consistency proofs since size S)
        run: python -c "import history_card; print('ok')"

      - name: Smoke — join_card (join-card record + card_consistency verifier)
        run: python -c "import join_card; print('ok')"

      - name: Smoke — send_bilateral_request (Move-1/Move-4 requester CLI)
        run: python -c "import send_bilateral_request; print('ok')"

      - name: Smoke — stranger_verify_bundle (disclosed-bundle stranger-verify CLI)
        run: python -c "import stranger_verify_bundle; print('ok')"

      - name: Smoke — capsule_field_inspector (data-inspector pretty-printer + fail-loud check)
        run: python -c "import capsule_field_inspector; print('ok')"

      - name: Smoke — capsule_mesh_viewer (words-first role/question offline HTML viewer; composes capsule_mesh_view)
        run: python -c "import capsule_mesh_viewer; print('ok')"

      - name: Smoke — mesh_viewer_static (the inline mesh_verify.js asset package)
        run: python -c "import mesh_viewer_static; from importlib import resources; resources.files('mesh_viewer_static').joinpath('mesh_verify.js').read_text(); print('ok')"

      - name: Smoke — capsule_accountability_tab (mesh-llm-ui-styled offline Accountability tab; composes capsule_mesh_view + capsule_mesh_viewer + capsule_sidecar)
        run: python -c "import capsule_accountability_tab; print('ok')"

      - name: Smoke — capsule_exchange_tab (Pane C "This exchange" subtab; composes capsule_accountability_tab + capsule_mesh_view + capsule_mesh_viewer)
        run: python -c "import capsule_exchange_tab; print('ok')"

      - name: Smoke — peer_accountability_tab (Pane B "Peers" -- composes capsule_accountability_tab + capsule_mesh_view + history_card)
        run: python -c "import peer_accountability_tab; print('ok')"

      - name: Smoke — native_log_join (join native /logs truth to sealed capsule truth, self-coverage finding)
        run: python -c "import native_log_join; print('ok')"

      - name: Smoke — twin_adjudicator (E17a offline twin-comparison adjudicator)
        run: python -c "import twin_adjudicator; print('ok')"

      - name: Smoke — self_accountability (Pane A "This node" card -- composes native_log_join + history_card + twin_adjudicator + capsule_accountability_tab)
        run: python -c "import self_accountability; print('ok')"

      - name: Smoke — evidence_server (E15 POST /evidence-request door + plugin-ledger bridge)
        run: python -c "import evidence_server; print('ok')"

      - name: Smoke — ask_history (E15 requester CLI -- offline bundle verify + history card render)
        run: python -c "import ask_history; print('ok')"

      - name: Smoke — adjudication_delivery ([mesh-adjudication-delivery-ack] POST /evidence/deliver door + ack-refused sealing)
        run: python -c "import adjudication_delivery; print('ok')"

      - name: Unit tests
        run: |
          pip install pytest
          pytest tests/ -v

  # Builds the real mesh-llm-plugin admission-policy plugin against mesh-llm's
  # actual published `mesh-llm-plugin` crate and runs it GREEN over the real
  # wire protocol (length-prefixed protobuf Envelope frames), not the private
  # spike's invented stdio/JSON protocol.
  #
  # Mutant verification (each negative check fails its mutant, both directions):
  #   - `cargo test --features mutant-allow-blocked` must fail
  #     `denies_request_for_blocked_model` (fail-open on the exact threat the
  #     policy exists to catch).
  #   - `cargo test --features mutant-allow-malformed` must fail
  #     `denies_malformed_body_fail_safe` (fail-open on unparseable input).
  #   Neither mutant feature is enabled here — CI only runs the correct build;
  #   the mutant runs are a manual proof captured in
  #   plugins/admission-policy/DELTA.md, not a permanently red CI job.
  #
  # `tests/interop.rs` implements the HOST side of the protocol itself (a
  # faithful stand-in — mesh-llm-host-runtime isn't published to crates.io).
  # `tests/host_runtime_e2e.rs` closes that gap against an actual
  # mesh-llm-host-runtime process, but can only run locally with a real
  # mesh-llm binary; see plugins/admission-policy/REAL-HOST-VERIFICATION.md
  # for the reproducible verification and what it found.
  admission-policy-plugin:
    name: admission-policy-plugin (real mesh-llm interop)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/admission-policy
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugins/admission-policy/target
          key: ${{ runner.os }}-cargo-admission-policy-${{ hashFiles('plugins/admission-policy/Cargo.lock') }}

      - name: Build plugin binary
        run: cargo build --locked

      - name: Unit tests (decision logic)
        run: cargo test --locked --bin admission-policy-plugin

      - name: Interop tests (real Envelope wire protocol + real HTTP dispatch)
        run: cargo test --locked --test interop -- --test-threads=1

      # `evidence-request/1` plugin-mesh-stream carrier: same fake-host
      # approach as `interop.rs` above (real Envelope wire protocol, real
      # compiled plugin binary), extended with `OpenStreamRequest` (responder
      # role) and `OpenMeshStreamRequest`/`tools/call` (requester role) --
      # no real mesh-llm-host-runtime process needed, so this runs in CI.
      - name: Mesh evidence-carrier interop tests (real Envelope wire protocol)
        run: cargo test --locked --test mesh_evidence_bridge_interop -- --test-threads=1

      # This test's own scenarios are #[ignore]'d and gated on MESH_LLM_HOST_BIN:
      # running them needs a real mesh-llm-host-runtime binary, which isn't
      # buildable in this repo's CI (see
      # plugins/admission-policy/REAL-HOST-VERIFICATION.md). This step only
      # keeps it compiling; "0 passed; 3 ignored" is the expected result here.
      - name: Real-host e2e test compiles (scenarios need a local mesh-llm binary)
        run: cargo test --locked --test host_runtime_e2e

  # Milestone 1 of #1332: emits ONE Agent Action Capsule + COSE_Sign1 signed
  # statement in Rust (JCS canonicalization, Ed25519, COSE_Sign1 via `coset`).
  # Milestone 2 adds chaining, a durable local ledger, key persistence +
  # rotation, an optional anchor client, and an offline verification CLI
  # (`src/ledger.rs`, `src/keys.rs::rotate`, `src/anchor.rs`,
  # `src/bin/verify_capsule.rs`).
  #
  # The de-risking question this crate exists to answer — is the Rust output
  # byte-conformant with the Python/scitt-cose/capsule-anchor reference —
  # is checked by `tests/jcs_vectors.rs`, `tests/cross_language_conformance.rs`
  # (M1), and `tests/chain_ledger_conformance.rs` +
  # `tests/anchor_conformance.rs` (M2), all #[ignore]'d and gated on env vars
  # pointing at the private multi-repo workspace (agent-action-capsule's
  # test-vectors/, the scitt-cose Python packages, scitt-cose-go-verify, and
  # capsule-anchor), none of which this repo's CI has checked out. Same shape
  # as admission-policy's host_runtime_e2e.rs above: this job only
  # compile-checks them ("0 passed; N ignored" is the expected result); the
  # actual cross-language conformance run is reproducible locally per the
  # doc comments at the top of each test file, and its output is captured in
  # plugins/capsule-producer/MILESTONE-1-REPORT.md and
  # plugins/capsule-producer/MILESTONE-2-REPORT.md.
  #
  # `tests/verify_cli.rs` is NOT gated -- it's self-contained (no external
  # workspace, no Python) and actually RUNS in CI, exercising the compiled
  # `verify_capsule` binary end-to-end.
  capsule-producer:
    name: capsule-producer (unit + CLI tests; cross-lang conformance compile-checked)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/capsule-producer
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugins/capsule-producer/target
          key: ${{ runner.os }}-cargo-capsule-producer-${{ hashFiles('plugins/capsule-producer/Cargo.lock') }}

      - name: Build
        run: cargo build --locked

      - name: Unit tests (JCS/capsule/keys/ledger canonicalization + mechanics)
        run: cargo test --locked --lib

      - name: Offline verification CLI tests (self-contained, no external workspace)
        run: cargo test --locked --test verify_cli

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Cross-language conformance tests compile (private workspace needed to actually run)
        run: |
          cargo test --locked --test jcs_vectors
          cargo test --locked --test cross_language_conformance
          cargo test --locked --test chain_ledger_conformance
          cargo test --locked --test anchor_conformance
