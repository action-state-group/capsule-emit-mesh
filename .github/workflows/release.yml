# SPDX-License-Identifier: Apache-2.0
# Plugin release — builds the admission-policy-plugin binary (statically
# linking capsule-producer) for each target mesh-llm's plugin installer
# resolves, packages it with its web UI bundle, and uploads a per-target
# archive plus one SHA256SUMS file to the GitHub Release.
#
# Staging and archiving live in plugins/admission-policy/package_release.py,
# so a local dry run builds exactly the package this workflow publishes. The
# script follows mesh-llm's plugin distribution contract (docs/plugins/README.md
# "GitHub Native Package Releases" and "Plugin Web UI Projection Contract" in
# Mesh-LLM/mesh-llm, checked against crates/mesh-llm-plugin-manager's
# extractor and asset matcher):
#   - asset name:      <plugin-name>-<version>-<target-triple>.tar.gz
#   - archive root:    one directory named exactly <plugin-name>
#   - inside the root: plugin.toml, the executable renamed to <plugin-name>,
#     plugin-manifest.json (printed by the built binary itself and required to
#     equal the reviewed plugin.package.json), bundle/ (the Evidence page, built
#     from web-ui/), README.md (INSTALL.md), LICENSE, NOTICE, and DEMO.md when
#     present. Anything else fails the build (never keys, ledgers, or demo data).
# `<plugin-name>` is `capsule-emit-mesh` throughout (this repo's name, the
# GitHub owner/repo installers key off, and PLUGIN_ID in src/main.rs).
#
# Unix targets ship .tar.gz only: mesh-llm's .zip extractor does not restore
# the executable bit.
#
# Rebuildable from the tag: the toolchain is pinned below, cargo runs with
# --locked, pnpm with --frozen-lockfile, and the archive itself is
# deterministic (SOURCE_DATE_EPOCH = the tagged commit's time).
#
# Triggered on a `v*` tag push; a tag with a pre-release suffix (e.g.
# v0.2.0-rc.1) publishes a GitHub pre-release. This workflow does not create or
# push a tag. `workflow_dispatch` re-runs the build for an existing tag (e.g.
# after a runner-side failure) without pushing a new one; it checks out that
# tag, not the default branch.
name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach assets to (e.g. v0.2.0-rc.1)"
        required: true

permissions:
  contents: write

env:
  PLUGIN_NAME: capsule-emit-mesh
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/admission-policy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugins/admission-policy/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-release-${{ env.RUST_TOOLCHAIN }}-${{ matrix.target }}-${{ hashFiles('plugins/admission-policy/Cargo.lock') }}

      - name: Build (release)
        run: cargo build --locked --release --target ${{ matrix.target }} --bin admission-policy-plugin

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: plugins/admission-policy/web-ui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: plugins/admission-policy/web-ui/pnpm-lock.yaml

      - name: Build the web UI bundle
        working-directory: plugins/admission-policy/web-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Resolve version and source date from the tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      # Every matrix target builds on a runner of its own OS/arch, so the
      # just-built binary runs here and prints its own package manifest.
      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          python3 package_release.py \
            --version "${{ steps.version.outputs.version }}" \
            --target "${{ matrix.target }}" \
            --binary "target/${{ matrix.target }}/release/admission-policy-plugin" \
            --out-dir dist
          echo "asset=${PLUGIN_NAME}-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: |
            plugins/admission-policy/dist/${{ steps.package.outputs.asset }}
            plugins/admission-policy/dist/${{ steps.package.outputs.asset }}.sha256
          if-no-files-found: error

  publish:
    name: publish (SHA256SUMS + release assets)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: SHA256SUMS (verified against each build's own digest)
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -c ./*.sha256
          sha256sum ./*.tar.gz | sed 's#  \./#  #' | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          archives=(./*.tar.gz)
          test "$(wc -l < SHA256SUMS)" -eq "${#archives[@]}"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          body_path: plugins/admission-policy/INSTALL.md
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS
          fail_on_unmatched_files: true
